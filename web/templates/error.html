{% extends "base.html" %}

{% block title %}System Notice{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-12 bg-slate-800/90 border border-slate-700 p-8 rounded-xl shadow-lg text-center space-y-4">
    <div class="text-4xl">⚠️</div>
    <h2 class="text-xl font-bold text-white">Pipeline Execution Required</h2>
    <p class="text-sm text-slate-300 leading-relaxed">
        {{ message }}
    </p>
    <div class="bg-slate-900/80 p-4 rounded-lg font-mono text-xs text-sky-400 border border-slate-700 inline-block text-left">
        # In terminal, run the complete automated pipeline:<br>
        python cli.py run-all
    </div>
    <div class="pt-2">
        <a href="/" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-bold transition-colors">
            Refresh Page
        </a>
    </div>
</div>
{% endblock %}
